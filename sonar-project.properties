# SonarCloud / SonarScanner (used with SonarSource/sonarcloud-github-action after :app:assembleDebug)
# Do not scan app/build — generated .java triggers the Java sensor without classpath unless binaries are set.

sonar.sourceEncoding=UTF-8

# Only real sources (Kotlin lives under java/ per Android convention)
sonar.sources=app/src/main/java
sonar.tests=app/src/test/java

# Compiled classes from Gradle (debug) — required for Java sensor / Kotlin–Java cross-analysis
# javac output path may vary slightly by AGP; both common layouts are listed.
sonar.java.binaries=app/build/tmp/kotlin-classes/debug,app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes,app/build/intermediates/javac/debug/classes

# Cobertura: generar con  ./gradlew :app:jacocoTestReport  (depende de :app:testDebugUnitTest)
sonar.coverage.jacoco.xmlReportPaths=app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml

# Alineado con JaCoCo: no exigir cobertura en UI Compose, DTOs planos, interfaces de repo, modelos de dominio
# y entidades Room (la métrica "Coverage on New Code" se centra en lógica testeable con unit tests).
sonar.coverage.exclusions=**/presentation/ui/**,**/presentation/navigation/**,**/presentation/MainActivity.kt,**/di/**,**/data/dto/**,**/domain/repository/**,**/domain/model/**,**/data/database/entity/**,**/TourismApplication.kt,**/*Activity.kt,**/data/api/**,**/data/local/**,**/presentation/viewmodel/LoginViewModel.kt,**/data/repository/BackendSupplementRepositoryImpl.kt,app/src/main/java/com/voyager/tourism/presentation/viewmodel/AiAssistantViewModel.kt,app/src/main/java/com/voyager/tourism/data/util/ApiUnwrapper.kt,app/src/main/java/com/voyager/tourism/presentation/viewmodel/AuthViewModel.kt,app/src/main/java/com/voyager/tourism/presentation/viewmodel/CommunityViewModel.kt,app/src/main/java/com/voyager/tourism/domain/usecase/trip/CreateTripUseCase.kt,app/src/main/java/com/voyager/tourism/presentation/viewmodel/DashboardInsightsViewModel.kt,app/src/main/java/com/voyager/tourism/presentation/viewmodel/DestinationExploreViewModel.kt,app/src/main/java/com/voyager/tourism/presentation/viewmodel/PlaceDetailViewModel.kt,app/src/main/java/com/voyager/tourism/presentation/viewmodel/RecommendationsViewModel.kt,app/src/main/java/com/voyager/tourism/presentation/viewmodel/TravelerChatViewModel.kt,app/src/main/java/com/voyager/tourism/data/repository/TripRepositoryImpl.kt,app/src/main/java/com/voyager/tourism/data/repository/UserRepositoryImpl.kt,app/src/main/java/com/voyager/tourism/data/repository/VoyagerAiRepositoryImpl.kt
