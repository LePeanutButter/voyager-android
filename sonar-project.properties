# SonarCloud / SonarScanner (used with SonarSource/sonarcloud-github-action after :app:assembleDebug)
# Do not scan app/build — generated .java triggers the Java sensor without classpath unless binaries are set.

sonar.sourceEncoding=UTF-8

# Only real sources (Kotlin lives under java/ per Android convention)
sonar.sources=app/src/main/java
sonar.tests=app/src/test/java

# Compiled classes from Gradle (debug) — required for Java sensor / Kotlin–Java cross-analysis
# javac output path may vary slightly by AGP; both common layouts are listed.
sonar.java.binaries=app/build/tmp/kotlin-classes/debug,app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes,app/build/intermediates/javac/debug/classes

# Cobertura: generar con  ./gradlew :app:jacocoTestReport  (depende de :app:testDebugUnitTest)
sonar.coverage.jacoco.xmlReportPaths=app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
